# One Blueprint: the app, its database, and the nightly report.
#
# On Render: New → Blueprint → pick this repo → Apply. It creates all three and
# wires them together. SESSION_SECRET is generated for you; the only values you
# ever type are the optional ones marked sync: false below.
#
# Free instead of paid: set the web service to `plan: free`, the database to
# `plan: free`, and delete the cron service (Render has no free cron). A free
# database is deleted after 30 days, so move to paid before you rely on it.
services:
  - type: web
    name: financial-book
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: financial-book-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true      # signs the login cookie; Render makes one
      - key: ANTHROPIC_API_KEY
        sync: false          # optional: set it to have Claude read the sentences
      - key: NODE_VERSION
        value: "22"

  # The day report, at your cut-off time. 19:00 in Lubumbashi (UTC+2) is 17:00 UTC.
  - type: cron
    name: financial-book-day-report
    runtime: node
    plan: starter
    schedule: "0 17 * * *"
    buildCommand: npm ci
    startCommand: npm run report:send
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: financial-book-db
          property: connectionString
      - key: REPORT_TO
        sync: false          # where the report should land
      - key: SMTP_URL
        sync: false          # e.g. smtps://user:pass@smtp.gmail.com:465
      - key: NODE_VERSION
        value: "22"

databases:
  - name: financial-book-db
    plan: basic-256mb
    postgresMajorVersion: "16"
