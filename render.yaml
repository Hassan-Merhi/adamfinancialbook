# Production Blueprint for Adam Financial Book.
# The application database lives on Neon; Render owns the web process and report cron.
services:
  - type: web
    name: adam-financial-book
    runtime: node
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run typecheck && npm test -- --passWithNoTests && npm run build
    # npm start validates the environment, applies ordered DB migrations under a
    # PostgreSQL advisory lock, verifies schema currency, then opens HTTP.
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PGSSL
        value: verify
      - key: PGPOOL_MAX
        value: "8"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_TRANSLATE_API_KEY
        sync: false

  - type: cron
    name: adam-financial-book-day-report
    runtime: node
    plan: starter
    branch: main
    schedule: "0 17 * * *"
    buildCommand: npm ci
    startCommand: npm run report:send
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PGSSL
        value: verify
      - key: REPORT_TO
        sync: false
      - key: REPORT_FROM
        sync: false
      - key: SMTP_URL
        sync: false
