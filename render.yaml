# One Blueprint: the app and the nightly report. The database lives on Neon.
#
# On Render: New → Blueprint → pick this repo → Apply. Then paste your Neon
# connection string into DATABASE_URL on both services. SESSION_SECRET is
# generated for you; everything else marked sync: false is optional.
#
# Free while testing: set the web service to `plan: free` and delete the cron
# service (Render has no free cron). Neon's free database is not deleted after
# 30 days the way Render's is, which is why the database lives there.
services:
  - type: web
    name: financial-book
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run db:setup && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false          # your Neon connection string (the pooled one)
      - key: SESSION_SECRET
        generateValue: true      # signs the login cookie; Render makes one
      - key: ANTHROPIC_API_KEY
        sync: false          # optional: set it to have Claude read the sentences
      - key: NODE_VERSION
        value: "22"

  # The day report, at your cut-off time. 19:00 in Lubumbashi (UTC+2) is 17:00 UTC.
  - type: cron
    name: financial-book-day-report
    runtime: node
    plan: starter
    schedule: "0 17 * * *"
    buildCommand: npm ci
    startCommand: npm run report:send
    envVars:
      - key: DATABASE_URL
        sync: false          # the same Neon connection string
      - key: REPORT_TO
        sync: false          # where the report should land
      - key: SMTP_URL
        sync: false          # e.g. smtps://user:pass@smtp.gmail.com:465
      - key: NODE_VERSION
        value: "22"
