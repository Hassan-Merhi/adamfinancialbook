# One click on Render: a web service and its database.
# Point Render at this repo and it reads this file — nothing to configure by hand
# except APP_TOKEN, which is what keeps the book private until Phase 4 adds login.
services:
  - type: web
    name: financial-book
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: financial-book-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true      # signs the login cookie; Render makes one
      - key: ANTHROPIC_API_KEY
        sync: false          # optional: set it to have Claude read the sentences
      - key: NODE_VERSION
        value: "22"

  # The day report, at your cut-off time. 19:00 in Lubumbashi (UTC+2) is 17:00 UTC.
  - type: cron
    name: financial-book-day-report
    runtime: node
    plan: starter
    schedule: "0 17 * * *"
    buildCommand: npm ci
    startCommand: npm run report:send
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: financial-book-db
          property: connectionString
      - key: REPORT_TO
        sync: false          # where the report should land
      - key: SMTP_URL
        sync: false          # e.g. smtps://user:pass@smtp.gmail.com:465
      - key: SESSION_SECRET
        sync: false
      - key: NODE_VERSION
        value: "22"

databases:
  - name: financial-book-db
    plan: basic-256mb
    postgresMajorVersion: "16"
