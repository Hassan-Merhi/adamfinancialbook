name: One-time qs security repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Regenerate only the vulnerable transitive dependency
        run: npm update qs --package-lock-only
      - name: Commit the patched lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile change was needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Fix qs security advisory'
          git push
