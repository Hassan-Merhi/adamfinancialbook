name: Phase 1 certification fix

on:
  push:
    branches:
      - feature/offline-correct-void-phase1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-certification:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/offline-correct-void-phase1
          fetch-depth: 0
      - name: Update migration 8 certification expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('server/api.integration.test.ts'): [
                  ('.toEqual([1, 2, 3, 4, 5, 6, 7]);', '.toEqual([1, 2, 3, 4, 5, 6, 7, 8]);'),
              ],
              Path('server/security.integration.test.ts'): [
                  ('.toEqual([1, 2, 3, 4, 5, 6, 7]);', '.toEqual([1, 2, 3, 4, 5, 6, 7, 8]);'),
              ],
              Path('server/recovery.integration.test.ts'): [
                  ('expect(snapshot.migrationVersion).toBe(7);', 'expect(snapshot.migrationVersion).toBe(8);'),
                  ('expect(Number(migration.rows[0]?.version)).toBe(7);', 'expect(Number(migration.rows[0]?.version)).toBe(8);'),
              ],
          }

          changed = 0
          for path, pairs in replacements.items():
              text = path.read_text()
              original = text
              for old, new in pairs:
                  if old not in text and new not in text:
                      raise SystemExit(f'Expected certification text not found in {path}: {old}')
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
                  changed += 1

          print(f'Updated {changed} certification files')
          PY
      - name: Commit certification updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No certification changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/api.integration.test.ts server/security.integration.test.ts server/recovery.integration.test.ts
          git commit -m "test: certify migration 8 for offline revisions"
          git push origin HEAD:feature/offline-correct-void-phase1
