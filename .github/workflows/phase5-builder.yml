name: Phase 5 Offline Attachment Hardening Builder

on:
  push:
    branches:
      - feature/offline-attachments-phase5-hardening
    paths:
      - .github/workflows/phase5-builder.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/offline-attachments-phase5-hardening
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Phase 5 hardening
        run: node scripts/phase5-build.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --passWithNoTests
      - name: Production build
        run: npm run build
      - name: Commit verified Phase 5 code
        run: |
          git config user.name "Hassan Merhi Dakik"
          git config user.email "hassmerhi.etshadi@gmail.com"
          git add client/src/offline-attachments.ts client/src/OfflineAttachmentStatus.tsx client/src/offline-phase5-hardening.test.ts server/offline-attachments.ts server/offline-attachments.integration.test.ts docs/OFFLINE_PHASE5_ATTACHMENT_HARDENING.md
          git diff --cached --quiet && exit 0
          git commit -m "feat: harden offline attachment lifecycle"
          git push origin HEAD:feature/offline-attachments-phase5-hardening
