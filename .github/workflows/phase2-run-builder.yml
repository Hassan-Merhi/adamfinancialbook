name: Run Phase 2 builder

on:
  push:
    branches:
      - feature/offline-safe-setup-phase2

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/offline-safe-setup-phase2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Extract and execute implementation script
        shell: bash
        run: |
          sed -n "/python3 <<'PY'/,/^          PY$/p" .github/workflows/phase2-offline-safe-setup-builder.yml | sed '1d;$d;s/^          //' > /tmp/phase2-builder.py
          sed -i "s/: 'Sync pending — balances include unsynced entries/? 'Sync pending — balances include unsynced entries/" /tmp/phase2-builder.py
          sed -i "s/: 'Sync pending — balances include unsynced changes/? 'Sync pending — balances include unsynced changes/" /tmp/phase2-builder.py
          python3 /tmp/phase2-builder.py
          sed -i "s/balances include unsynced entries until the server confirms them/balances include unsynced changes until the server confirms them/" client/src/offline-phase2.test.ts
      - name: Verify implementation
        run: npm run typecheck && npm test -- --passWithNoTests && npm run build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 2: queue safe setup creation offline"
          git push origin HEAD:feature/offline-safe-setup-phase2
