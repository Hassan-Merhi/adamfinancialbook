name: Production Health Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-health-monitor.yml'
      - 'server/monitor.ts'
      - 'server/alerts.ts'
      - 'server/integrity-monitor.ts'
      - 'render.yaml'

permissions:
  contents: read
  issues: write

concurrency:
  group: production-health-monitor
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HEALTH_URL: https://adamfinancialbook.onrender.com/api/health/ready
      INCIDENT_TITLE: '[Production Monitor] Adam Financial Book readiness failure'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check readiness and manage incident issue
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.error
          import urllib.request

          health_url = os.environ['HEALTH_URL']
          incident_title = os.environ['INCIDENT_TITLE']
          repository = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          run_url = os.environ['RUN_URL']
          api_base = f'https://api.github.com/repos/{repository}'

          def github(path, method='GET', body=None):
              data = None if body is None else json.dumps(body).encode('utf-8')
              request = urllib.request.Request(
                  f'{api_base}{path}',
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  raw = response.read().decode('utf-8')
                  return json.loads(raw) if raw else None

          def open_incident():
              issues = github('/issues?state=open&per_page=100') or []
              return next((item for item in issues
                           if 'pull_request' not in item and item.get('title') == incident_title), None)

          checked_at = dt.datetime.now(dt.timezone.utc).isoformat()
          payload = None
          status = None
          error = None
          try:
              request = urllib.request.Request(
                  health_url,
                  headers={'Accept': 'application/json', 'User-Agent': 'adam-financial-book-production-monitor'},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = response.status
                  payload = json.loads(response.read().decode('utf-8'))
          except Exception as exc:
              error = f'{type(exc).__name__}: {exc}'

          healthy = (
              status is not None
              and 200 <= status < 300
              and isinstance(payload, dict)
              and payload.get('ok') is True
              and payload.get('database') == 'ok'
              and payload.get('migrations') == 'current'
              and payload.get('pendingMigrations') == 0
          )

          incident = open_incident()
          if healthy:
              if incident:
                  number = incident['number']
                  github(
                      f'/issues/{number}/comments',
                      'POST',
                      {'body': f'✅ Production readiness recovered at `{checked_at}`.\n\nRun: {run_url}'},
                  )
                  github(f'/issues/{number}', 'PATCH', {'state': 'closed', 'state_reason': 'completed'})
              print(json.dumps({
                  'event': 'production.health.ok',
                  'checkedAt': checked_at,
                  'status': status,
                  'database': payload.get('database'),
                  'migrations': payload.get('migrations'),
                  'currentMigration': payload.get('currentMigration'),
                  'latestMigration': payload.get('latestMigration'),
              }))
              raise SystemExit(0)

          diagnostic = {
              'checkedAt': checked_at,
              'status': status,
              'error': error,
              'payload': payload,
              'run': run_url,
          }
          if not incident:
              github('/issues', 'POST', {
                  'title': incident_title,
                  'body': (
                      'The independent 10-minute production monitor detected a readiness failure.\n\n'
                      f'```json\n{json.dumps(diagnostic, indent=2)}\n```\n\n'
                      'This issue will be closed automatically after production readiness recovers.'
                  ),
              })
          print(json.dumps({'event': 'production.health.failed', **diagnostic}))
          raise SystemExit('Production readiness check failed.')
          PY
