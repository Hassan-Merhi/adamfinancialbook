name: Disaster Recovery Certification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: book
          POSTGRES_PASSWORD: book
          POSTGRES_DB: book_dr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U book -d book_dr_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      TEST_DATABASE_URL: postgres://book:book@127.0.0.1:5432/book_dr_test
      DATABASE_URL: postgres://book:book@127.0.0.1:5432/book_dr_test
      PGSSL: off
      SESSION_SECRET: ci-${{ github.sha }}-disaster-recovery-only
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build production client
        run: npm run build
      - name: Run encrypted backup restore and boot drill
        run: npm run test:dr
      - name: Re-establish source schema after drill
        if: always()
        run: npm run db:migrate
      - name: Verify source database integrity after drill
        if: success()
        run: npm run db:integrity
