name: Production Scale Certification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-production-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: book
          POSTGRES_PASSWORD: book
          POSTGRES_DB: book_phase4_scale
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U book -d book_phase4_scale"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      TEST_DATABASE_URL: postgres://book:book@127.0.0.1:5432/book_phase4_scale
      DATABASE_URL: postgres://book:book@127.0.0.1:5432/book_phase4_scale
      PGSSL: off
      SESSION_SECRET: phase4-ci-${{ github.sha }}-session-secret-value
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare production-scale schema
        run: npm run db:migrate
      - name: Run Phase 4 production load certification
        run: npm run test:phase4-load
