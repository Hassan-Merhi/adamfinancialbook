name: Temp TypeScript 7 Rebase
on:
  push:
    branches:
      - temp-ts7-rebase
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm install typescript@7.0.2 --save-dev --package-lock-only --ignore-scripts
      - run: git rm .github/workflows/temp-ts7-rebase.yml
      - run: |
          git config user.name "Hassan Merhi Dakik"
          git config user.email "hassmerhi.etshadi@gmail.com"
          git add package.json package-lock.json
          git commit -m "Rebase TypeScript 7.0.2 upgrade onto current main"
          git push
