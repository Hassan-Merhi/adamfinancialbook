name: Fix safe reset lockfile

on:
  push:
    branches: [feature/safe-data-reset]

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/safe-data-reset
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm install express-rate-limit@7.5.1 --save --package-lock-only --ignore-scripts
      - name: Commit lockfile update and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-safe-reset-lock.yml
          git add package.json package-lock.json
          git commit -m "Add rate limiting dependency for safe reset"
          git push origin HEAD:feature/safe-data-reset
