name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Verify lockfile installs without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Block moderate+ production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate
      - name: Block high+ vulnerabilities anywhere in the tree
        run: npm audit --audit-level=high
      - name: Scan tracked source for obvious secrets
        run: node scripts/security-check.mjs

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: '/language:javascript-typescript'
          output: codeql-results
          upload: never
      - name: Block high and critical CodeQL findings
        run: node scripts/codeql-gate.mjs codeql-results

  # GitHub Code Scanning is not enabled for this private repository on its
  # current plan, so uploading SARIF makes an otherwise successful CodeQL scan
  # fail while calling unavailable GitHub APIs. CodeQL still runs the full
  # security-extended query suite and writes SARIF locally; codeql-gate.mjs is
  # the blocking high/critical gate and keeps the existing severity threshold.
  # If GitHub Code Scanning becomes available later, SARIF upload can be restored
  # as an additional reporting layer without changing the blocking local gate.
  #
  # GitHub dependency-review requires the repository Dependency Graph feature.
  # This repository does not expose that feature, so npm audit remains the
  # blocking dependency gate instead of running a check that can only fail on
  # repository configuration before inspecting dependencies.
