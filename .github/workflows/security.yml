name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify lockfile installs without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Block moderate+ production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate
      - name: Block high+ vulnerabilities anywhere in the tree
        run: npm audit --audit-level=high
      - name: Scan tracked source for obvious secrets
        run: node scripts/security-check.mjs

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
          output: codeql-results
          upload: always
      - name: Block high and critical CodeQL findings
        run: node scripts/codeql-gate.mjs codeql-results

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
