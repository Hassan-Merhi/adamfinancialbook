name: Phase 1 sync main

on:
  push:
    branches:
      - feature/offline-correct-void-phase1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/offline-correct-void-phase1
          fetch-depth: 0
      - name: Merge current main into Phase 1
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:feature/offline-correct-void-phase1
