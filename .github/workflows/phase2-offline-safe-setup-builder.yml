name: Build offline safe setup Phase 2

on:
  push:
    branches:
      - feature/offline-safe-setup-phase2

permissions:
  contents: write

jobs:
  build-phase:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/offline-safe-setup-phase2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply Phase 2 implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected source not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          Path('shared/offline-setup.ts').write_text(r'''/** Offline-safe creation payloads for non-destructive book setup. */
export type OfflineSetupType = 'business' | 'account' | 'project' | 'person' | 'reminder';

export type OfflineSetupDraft =
  | { setupType: 'business'; name: string }
  | { setupType: 'account'; name: string; businessId: string | null; opening: number }
  | { setupType: 'project'; name: string; businessId: string; opening: number; scope?: string }
  | { setupType: 'person'; name: string; businessId: string; kind: 'receivable' | 'payable' | 'salary'; opening: number; salary: number; role: string }
  | { setupType: 'reminder'; what: string; amount: number; accountId: string | null; note?: string };

export type OfflineSetupInput = (OfflineSetupDraft & {
  offlineOperation: 'setup_create';
  /** The durable outbox id. It is also the idempotency key for server replay. */
  clientRef?: string | null;
});

const PREFIX: Record<OfflineSetupType, string> = {
  business: 'biz',
  account: 'acc',
  project: 'prj',
  person: 'per',
  reminder: 'rem',
};

function token(clientRef: string | null | undefined): string {
  const clean = String(clientRef ?? '').trim().replace(/[^A-Za-z0-9_-]/g, '_').slice(0, 70);
  if (!clean) throw new Error('Offline setup is missing its durable client reference.');
  return clean;
}

/**
 * The final PostgreSQL id is derivable before sync. That lets the projected UI
 * use the exact future server id without a fragile temp-id rewrite.
 */
export function offlineSetupEntityId(input: Pick<OfflineSetupInput, 'setupType' | 'clientRef'>): string {
  return `${PREFIX[input.setupType]}_${token(input.clientRef)}`;
}

export function offlineSetupReceiptId(clientRef: string | null | undefined): string {
  return `rcp_${token(clientRef)}`;
}

export function isOfflineSetupInput(value: unknown): value is OfflineSetupInput {
  if (!value || typeof value !== 'object') return false;
  const item = value as { offlineOperation?: unknown; setupType?: unknown };
  return item.offlineOperation === 'setup_create'
    && ['business', 'account', 'project', 'person', 'reminder'].includes(String(item.setupType));
}
''')

          Path('server/offline-setup.ts').write_text(r'''/** Exactly-once offline creation for safe, non-destructive setup records. */
import { Router, type Request, type Response, type NextFunction } from 'express';
import type { PoolClient } from 'pg';
import { z } from 'zod';
import { pool, query } from './db.js';
import { recordRequired } from './audit.js';
import { ensureLoanPair } from './book.js';
import { offlineSetupEntityId, offlineSetupReceiptId, type OfflineSetupInput } from '../shared/offline-setup.js';

export const offlineSetupRouter = Router();

class SetupConflict extends Error {
  constructor(message: string, readonly code: 'OFFLINE_CONFLICT_IDEMPOTENCY_KEY_REUSED' | 'OFFLINE_CONFLICT_TARGET_MISSING') {
    super(message);
  }
}

const marker = {
  offlineOperation: z.literal('setup_create'),
  clientRef: z.string().min(1).max(80),
};
const businessSchema = z.object({ ...marker, setupType: z.literal('business'), name: z.string().trim().min(1).max(80) });
const accountSchema = z.object({ ...marker, setupType: z.literal('account'), name: z.string().trim().min(1).max(80), businessId: z.string().nullish(), opening: z.number().default(0) });
const projectSchema = z.object({ ...marker, setupType: z.literal('project'), name: z.string().trim().min(1).max(80), businessId: z.string().min(1), opening: z.number().default(0), scope: z.string().max(200).default('') });
const personSchema = z.object({ ...marker, setupType: z.literal('person'), name: z.string().trim().min(1).max(80), businessId: z.string().min(1), kind: z.enum(['receivable', 'payable', 'salary']), opening: z.number().default(0), salary: z.number().default(0), role: z.string().max(120).default('') });
const reminderSchema = z.object({ ...marker, setupType: z.literal('reminder'), what: z.string().trim().min(1).max(120), amount: z.number().default(0), accountId: z.string().nullish(), note: z.string().max(500).default('') });

function offlineOwner(handler: (req: Request, res: Response) => Promise<void>) {
  return (req: Request, res: Response, next: NextFunction) => {
    if (req.body?.offlineOperation !== 'setup_create') return next();
    if (req.user?.role !== 'owner') {
      res.status(403).json({ error: 'Only you can change that — ask the owner.' });
      return;
    }
    void handler(req, res).catch((error) => {
      if (error instanceof SetupConflict) {
        res.status(409).json({ error: error.message, code: error.code });
        return;
      }
      next(error);
    });
  };
}

async function locked<T>(userId: string, clientRef: string, work: (client: PoolClient) => Promise<T>): Promise<T> {
  const client = await pool.connect();
  try {
    await client.query('BEGIN');
    await client.query('SELECT pg_advisory_xact_lock(hashtext($1))', [`offline-setup:${userId}:${clientRef}`]);
    const result = await work(client);
    await client.query('COMMIT');
    return result;
  } catch (error) {
    await client.query('ROLLBACK');
    throw error;
  } finally {
    client.release();
  }
}

function reused(): never {
  throw new SetupConflict('That offline setup reference was already used for different data. Review the stored change before retrying.', 'OFFLINE_CONFLICT_IDEMPOTENCY_KEY_REUSED');
}

async function requireParent(client: PoolClient, table: 'businesses' | 'accounts', id: string): Promise<void> {
  const found = await client.query(`SELECT id FROM ${table} WHERE id = $1`, [id]);
  if (!found.rowCount) {
    throw new SetupConflict('A setup item this change depends on is not on the server yet.', 'OFFLINE_CONFLICT_TARGET_MISSING');
  }
}

function sameNumber(a: unknown, b: number): boolean {
  return Math.abs(Number(a) - Number(b)) < 0.000001;
}

async function auditSetup(client: PoolClient, type: string, id: string, body: OfflineSetupInput): Promise<void> {
  await recordRequired(client, `offline setup ${type} created`, id, {
    clientRef: body.clientRef ?? null,
    setupType: body.setupType,
  });
}

offlineSetupRouter.post('/businesses', offlineOwner(async (req, res) => {
  const body = businessSchema.parse(req.body) as OfflineSetupInput & { setupType: 'business'; name: string; clientRef: string };
  const id = offlineSetupEntityId(body);
  const created = await locked(req.user!.id, body.clientRef, async (client) => {
    const existing = await client.query<{ name: string }>('SELECT name FROM businesses WHERE id = $1', [id]);
    if (existing.rows[0]) {
      if (existing.rows[0].name !== body.name) reused();
      return false;
    }
    await client.query('INSERT INTO businesses (id, name) VALUES ($1,$2)', [id, body.name]);
    await auditSetup(client, 'business', id, body);
    return true;
  });
  // Re-run this idempotent repair on replay too. If the first response was lost,
  // every canonical inter-business loan pair still converges before acknowledgement.
  const others = await query<{ id: string }>('SELECT id FROM businesses WHERE id <> $1', [id]);
  for (const other of others) await ensureLoanPair(id, other.id);
  res.status(created ? 201 : 200).json({ id, name: body.name, clientRef: body.clientRef, created });
}));

offlineSetupRouter.post('/accounts', offlineOwner(async (req, res) => {
  const body = accountSchema.parse(req.body) as OfflineSetupInput & { setupType: 'account'; name: string; businessId: string | null; opening: number; clientRef: string };
  const id = offlineSetupEntityId(body);
  const created = await locked(req.user!.id, body.clientRef, async (client) => {
    if (body.businessId) await requireParent(client, 'businesses', body.businessId);
    const existing = await client.query<{ name: string; business_id: string | null; opening: number }>('SELECT name, business_id, opening FROM accounts WHERE id = $1', [id]);
    const row = existing.rows[0];
    if (row) {
      if (row.name !== body.name || row.business_id !== (body.businessId ?? null) || !sameNumber(row.opening, body.opening)) reused();
      return false;
    }
    await client.query('INSERT INTO accounts (id, name, business_id, opening) VALUES ($1,$2,$3,$4)', [id, body.name, body.businessId ?? null, body.opening]);
    await auditSetup(client, 'account', id, body);
    return true;
  });
  res.status(created ? 201 : 200).json({ id, ...body, created });
}));

offlineSetupRouter.post('/projects', offlineOwner(async (req, res) => {
  const body = projectSchema.parse(req.body) as OfflineSetupInput & { setupType: 'project'; name: string; businessId: string; opening: number; scope: string; clientRef: string };
  const id = offlineSetupEntityId(body);
  const receiptId = offlineSetupReceiptId(body.clientRef);
  const created = await locked(req.user!.id, body.clientRef, async (client) => {
    await requireParent(client, 'businesses', body.businessId);
    const existing = await client.query<{ name: string; business_id: string; scope: string }>('SELECT name, business_id, scope FROM projects WHERE id = $1', [id]);
    const row = existing.rows[0];
    if (row) {
      const receipt = await client.query<{ amount: number }>('SELECT amount FROM project_receipts WHERE id = $1 AND voided_at IS NULL', [receiptId]);
      const openingMatches = body.opening > 0 ? !!receipt.rows[0] && sameNumber(receipt.rows[0].amount, body.opening) : !receipt.rows[0];
      if (row.name !== body.name || row.business_id !== body.businessId || row.scope !== body.scope || !openingMatches) reused();
      return false;
    }
    await client.query('INSERT INTO projects (id, name, scope, business_id) VALUES ($1,$2,$3,$4)', [id, body.name, body.scope, body.businessId]);
    if (body.opening > 0) {
      await client.query(`INSERT INTO project_receipts (id, project_id, occurred_on, amount, in_cash, entry_id) VALUES ($1,$2,NULL,$3,true,NULL)`, [receiptId, id, body.opening]);
    }
    await auditSetup(client, 'project', id, body);
    return true;
  });
  res.status(created ? 201 : 200).json({ id, ...body, created });
}));

offlineSetupRouter.post('/people', offlineOwner(async (req, res) => {
  const body = personSchema.parse(req.body) as OfflineSetupInput & { setupType: 'person'; name: string; businessId: string; kind: 'receivable' | 'payable' | 'salary'; opening: number; salary: number; role: string; clientRef: string };
  const id = offlineSetupEntityId(body);
  const created = await locked(req.user!.id, body.clientRef, async (client) => {
    await requireParent(client, 'businesses', body.businessId);
    const existing = await client.query<{ name: string; business_id: string; kind: string; opening: number; salary: number; role: string }>('SELECT name, business_id, kind, opening, salary, role FROM people WHERE id = $1', [id]);
    const row = existing.rows[0];
    if (row) {
      if (row.name !== body.name || row.business_id !== body.businessId || row.kind !== body.kind || !sameNumber(row.opening, body.opening) || !sameNumber(row.salary, body.salary) || row.role !== body.role) reused();
      return false;
    }
    await client.query(`INSERT INTO people (id, name, role, business_id, kind, opening, salary) VALUES ($1,$2,$3,$4,$5,$6,$7)`, [id, body.name, body.role, body.businessId, body.kind, body.opening, body.salary]);
    await auditSetup(client, 'person', id, body);
    return true;
  });
  res.status(created ? 201 : 200).json({ id, ...body, created });
}));

offlineSetupRouter.post('/reminders', offlineOwner(async (req, res) => {
  const body = reminderSchema.parse(req.body) as OfflineSetupInput & { setupType: 'reminder'; what: string; amount: number; accountId: string | null; note: string; clientRef: string };
  const id = offlineSetupEntityId(body);
  const created = await locked(req.user!.id, body.clientRef, async (client) => {
    if (body.accountId) await requireParent(client, 'accounts', body.accountId);
    const existing = await client.query<{ what: string; amount: number; account_id: string | null; note: string; settled: boolean }>('SELECT what, amount, account_id, note, settled FROM reminders WHERE id = $1', [id]);
    const row = existing.rows[0];
    if (row) {
      if (row.what !== body.what || !sameNumber(row.amount, body.amount) || row.account_id !== (body.accountId ?? null) || row.note !== body.note || row.settled) reused();
      return false;
    }
    await client.query('INSERT INTO reminders (id, what, amount, account_id, note) VALUES ($1,$2,$3,$4,$5)', [id, body.what, body.amount, body.accountId ?? null, body.note]);
    await auditSetup(client, 'reminder', id, body);
    return true;
  });
  res.status(created ? 201 : 200).json({ id, ...body, created });
}));
''')

          Path('client/src/offline-safe-setup-phase2.test.ts').write_text(r'''import { readFileSync } from 'node:fs';
import { join } from 'node:path';
import { describe, expect, it } from 'vitest';
import type { LoadedBook } from './api';
import { projectOfflineBook } from './offline-projection';
import { offlineSetupEntityId, type OfflineSetupInput } from '../../shared/offline-setup';
import type { Queued } from './offline-db';

const root = process.cwd();
const read = (path: string) => readFileSync(join(root, path), 'utf8');

function baseBook(): LoadedBook {
  return {
    businesses: [{ id: 'biz_confirmed', name: 'Confirmed' }],
    accounts: [{ id: 'acc_confirmed', name: 'Cash', businessId: 'biz_confirmed', opening: 100 }],
    projects: [], receipts: [], people: [], loans: [], entries: [], reminders: [],
    balances: { totalCash: 100, accounts: { acc_confirmed: 100 }, businesses: { biz_confirmed: 100 }, people: {}, loans: {}, projects: {} },
  };
}

function queued(id: string, input: OfflineSetupInput): Queued {
  return { id, input: input as any, queuedAt: '2026-09-06T10:00:00.000Z' };
}

describe('Offline safe setup Phase 2', () => {
  it('projects safe setup records with their final deterministic server ids', () => {
    const account: OfflineSetupInput = { offlineOperation: 'setup_create', setupType: 'account', name: 'Offline Cash', businessId: 'biz_confirmed', opening: 25, clientRef: 'q_account_1' };
    const project: OfflineSetupInput = { offlineOperation: 'setup_create', setupType: 'project', name: 'Offline Job', businessId: 'biz_confirmed', opening: 300, scope: '', clientRef: 'q_project_1' };
    const person: OfflineSetupInput = { offlineOperation: 'setup_create', setupType: 'person', name: 'Offline Supplier', businessId: 'biz_confirmed', kind: 'payable', opening: 75, salary: 0, role: 'Supplier', clientRef: 'q_person_1' };
    const reminder: OfflineSetupInput = { offlineOperation: 'setup_create', setupType: 'reminder', what: 'Offline reminder', amount: 9, accountId: 'acc_confirmed', note: '', clientRef: 'q_reminder_1' };
    const projected = projectOfflineBook(baseBook(), [queued('q_account_1', account), queued('q_project_1', project), queued('q_person_1', person), queued('q_reminder_1', reminder)]);
    const accountId = offlineSetupEntityId(account);
    const projectId = offlineSetupEntityId(project);
    const personId = offlineSetupEntityId(person);
    const reminderId = offlineSetupEntityId(reminder);
    expect(projected.accounts.find((item) => item.id === accountId)?.opening).toBe(25);
    expect(projected.balances.accounts[accountId]).toBe(25);
    expect(projected.balances.totalCash).toBe(125);
    expect(projected.balances.businesses.biz_confirmed).toBe(125);
    expect(projected.projects.find((item) => item.id === projectId)?.name).toBe('Offline Job');
    expect(projected.balances.projects[projectId]).toBe(300);
    expect(projected.people.find((item) => item.id === personId)?.name).toBe('Offline Supplier');
    expect(projected.balances.people[personId]).toBe(-75);
    expect(projected.reminders.find((item) => item.id === reminderId)?.what).toBe('Offline reminder');
  });

  it('keeps destructive and dependency-sensitive setup operations online-only', () => {
    const setup = read('client/src/views/Setup.tsx');
    expect(setup).toContain("outbox.setup({ setupType: 'business'");
    expect(setup).toContain("outbox.setup({ setupType: 'account'");
    expect(setup).toContain("outbox.setup({ setupType: 'project'");
    expect(setup).toContain("outbox.setup({ setupType: 'person'");
    expect(setup).toContain("outbox.setup({ setupType: 'reminder'");
    expect(setup).toContain('api.setLoan(');
    expect(setup).toContain('api.clearReminder(');
    expect(setup).toContain('confirmedBusinesses');
    expect(setup).toContain('confirmedAccounts');
  });

  it('routes offline setup through the protected idempotent server boundary before legacy setup routes', () => {
    const start = read('server/start.ts');
    const server = read('server/offline-setup.ts');
    expect(start).toContain('offlineSetupRouter');
    expect(start.indexOf('protectedSecurityRouter.use(offlineSetupRouter)')).toBeLessThan(start.indexOf('protectedSecurityRouter.use(offlineSyncRouter)'));
    expect(server).toContain('pg_advisory_xact_lock');
    expect(server).toContain('OFFLINE_CONFLICT_IDEMPOTENCY_KEY_REUSED');
    expect(server).toContain('OFFLINE_CONFLICT_TARGET_MISSING');
    expect(server).toContain('recordRequired');
  });
});
''')

          Path('server/offline-setup.integration.test.ts').write_text(r'''import { spawn } from 'node:child_process';
import { once } from 'node:events';
import pg from 'pg';
import { afterAll, beforeAll, describe, expect, it } from 'vitest';
import { offlineSetupEntityId } from '../shared/offline-setup.js';

const DATABASE_URL = process.env.TEST_DATABASE_URL;
const PORT = 43142;
const BASE = `http://127.0.0.1:${PORT}`;
let child: ReturnType<typeof spawn> | null = null;
let serverLog = '';
type Session = { cookie: string };

function sessionCookie(response: Response): string {
  const value = response.headers.get('set-cookie');
  if (!value) throw new Error('Expected session cookie');
  return value.split(';', 1)[0];
}

async function request(path: string, options: { method?: string; session?: Session; body?: unknown } = {}) {
  const method = options.method ?? 'GET';
  const headers = new Headers();
  if (options.session) headers.set('cookie', options.session.cookie);
  if (method !== 'GET' && method !== 'HEAD' && path !== '/api/login' && path !== '/api/first-owner') headers.set('x-book', '1');
  let body: string | undefined;
  if (options.body !== undefined) { headers.set('content-type', 'application/json'); body = JSON.stringify(options.body); }
  const response = await fetch(`${BASE}${path}`, { method, headers, body });
  const text = await response.text();
  let data: any = null;
  if (text) { try { data = JSON.parse(text); } catch { data = text; } }
  return { response, data };
}

async function db<T = any>(sql: string, params: unknown[] = []): Promise<T[]> {
  const client = new pg.Client({ connectionString: DATABASE_URL, ssl: false });
  await client.connect();
  try { return (await client.query(sql, params)).rows as T[]; } finally { await client.end(); }
}

async function resetToLegacyShape(): Promise<void> {
  const client = new pg.Client({ connectionString: DATABASE_URL, ssl: false });
  await client.connect();
  try {
    await client.query('DROP SCHEMA public CASCADE; CREATE SCHEMA public');
    await client.query(`CREATE TABLE users (id TEXT PRIMARY KEY, email TEXT NOT NULL UNIQUE, password_hash TEXT NOT NULL, role TEXT NOT NULL, created_at TIMESTAMPTZ NOT NULL DEFAULT now())`);
  } finally { await client.end(); }
}

async function waitUntilHealthy(): Promise<void> {
  for (let i = 0; i < 150; i += 1) {
    if (child && child.exitCode !== null) throw new Error(`Server exited before health check:\n${serverLog}`);
    try { if ((await fetch(`${BASE}/api/health`)).ok) return; } catch { /* starting */ }
    await new Promise((resolve) => setTimeout(resolve, 100));
  }
  throw new Error(`Server never became healthy:\n${serverLog}`);
}

describe.skipIf(!DATABASE_URL)('Offline safe setup Phase 2 PostgreSQL safety', () => {
  const owner: Session = { cookie: '' };

  beforeAll(async () => {
    await resetToLegacyShape();
    child = spawn(process.execPath, ['--import', 'tsx', 'server/start.ts'], {
      cwd: process.cwd(),
      env: { ...process.env, NODE_ENV: 'test', DATABASE_URL: DATABASE_URL!, SESSION_SECRET: 'offline-safe-setup-phase-2-integration-secret', PGSSL: 'off', PGPOOL_MAX: '4', PORT: String(PORT) },
      stdio: ['ignore', 'pipe', 'pipe'],
    });
    child.stdout?.on('data', (chunk) => { serverLog += chunk.toString(); });
    child.stderr?.on('data', (chunk) => { serverLog += chunk.toString(); });
    await waitUntilHealthy();
    const opened = await request('/api/first-owner', { method: 'POST', body: { email: 'owner@example.com', password: 'OwnerPass!2026' } });
    expect(opened.response.status).toBe(201);
    owner.cookie = sessionCookie(opened.response);
  }, 30_000);

  afterAll(async () => {
    const running = child;
    if (running && running.exitCode === null) {
      running.kill('SIGTERM');
      await Promise.race([once(running, 'exit'), new Promise((resolve) => setTimeout(resolve, 5_000))]);
      if (running.exitCode === null) running.kill('SIGKILL');
    }
    if (DATABASE_URL) {
      const client = new pg.Client({ connectionString: DATABASE_URL, ssl: false });
      await client.connect();
      try { await client.query('DROP SCHEMA public CASCADE; CREATE SCHEMA public'); } finally { await client.end(); }
    }
  }, 15_000);

  it('creates and replays a business exactly once with one required audit line', async () => {
    const body = { offlineOperation: 'setup_create', setupType: 'business', name: 'Offline Business', clientRef: 'q_setup_business_1' };
    const id = offlineSetupEntityId(body as any);
    const first = await request('/api/businesses', { method: 'POST', session: owner, body });
    const replay = await request('/api/businesses', { method: 'POST', session: owner, body });
    expect(first.response.status).toBe(201);
    expect(replay.response.status).toBe(200);
    expect(first.data.id).toBe(id);
    expect(replay.data.id).toBe(id);
    expect(Number((await db<{ n: number }>('SELECT count(*)::int AS n FROM businesses WHERE id = $1', [id]))[0].n)).toBe(1);
    expect(Number((await db<{ n: number }>("SELECT count(*)::int AS n FROM audit WHERE subject = $1 AND action = 'offline setup business created'", [id]))[0].n)).toBe(1);
  });

  it('serializes concurrent replay and preserves opening balances/project receipts', async () => {
    const businessId = offlineSetupEntityId({ setupType: 'business', clientRef: 'q_setup_business_1' } as any);
    const accountBody = { offlineOperation: 'setup_create', setupType: 'account', name: 'Offline Cash', businessId, opening: 125, clientRef: 'q_setup_account_1' };
    const [a, b] = await Promise.all([
      request('/api/accounts', { method: 'POST', session: owner, body: accountBody }),
      request('/api/accounts', { method: 'POST', session: owner, body: accountBody }),
    ]);
    expect([a.response.status, b.response.status].sort()).toEqual([200, 201]);
    const accountId = offlineSetupEntityId(accountBody as any);
    expect(Number((await db<{ n: number }>('SELECT count(*)::int AS n FROM accounts WHERE id = $1', [accountId]))[0].n)).toBe(1);

    const projectBody = { offlineOperation: 'setup_create', setupType: 'project', name: 'Offline Project', businessId, opening: 300, scope: '', clientRef: 'q_setup_project_1' };
    expect((await request('/api/projects', { method: 'POST', session: owner, body: projectBody })).response.status).toBe(201);
    const projectId = offlineSetupEntityId(projectBody as any);
    expect(Number((await db<{ n: number }>('SELECT count(*)::int AS n FROM project_receipts WHERE project_id = $1 AND entry_id IS NULL', [projectId]))[0].n)).toBe(1);

    const personBody = { offlineOperation: 'setup_create', setupType: 'person', name: 'Offline Supplier', businessId, kind: 'payable', opening: 75, salary: 0, role: 'Supplier', clientRef: 'q_setup_person_1' };
    expect((await request('/api/people', { method: 'POST', session: owner, body: personBody })).response.status).toBe(201);
