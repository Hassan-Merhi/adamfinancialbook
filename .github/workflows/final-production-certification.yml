name: Final Production Certification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: final-production-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-final-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: book
          POSTGRES_PASSWORD: book
          POSTGRES_DB: book_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U book -d book_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://book:book@127.0.0.1:5432/book_test
      TEST_DATABASE_URL: postgres://book:book@127.0.0.1:5432/book_test
      PGSSL: off
      SESSION_SECRET: final-certification-session-secret-at-least-32-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare certification database
        run: npm run db:migrate
      - name: Certify Phase 9 release contract
        run: npm run test:phase9-final
      - name: Run full production certification
        run: npm run certify:production
      - name: Write exact-SHA final certification evidence
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const evidence = {
            schema: 1,
            event: 'final-production.certified',
            sha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            repository: process.env.GITHUB_REPOSITORY,
            certifiedAt: new Date().toISOString(),
            guarantees: [
              'typecheck',
              'full-regression-suite',
              'production-build',
              'migration-status-current',
              'database-integrity',
              'phase9-release-contract'
            ]
          };
          fs.writeFileSync('final-production-certification.json', JSON.stringify(evidence, null, 2));
          console.log(JSON.stringify(evidence));
          NODE
      - name: Retain exact-SHA final certification evidence
        uses: actions/upload-artifact@043fb46e7f5080e8e1f3cc696e2d5fc9c1fe4c15
        with:
          name: final-production-certification-${{ github.sha }}
          path: final-production-certification.json
          if-no-files-found: error
          retention-days: 90
