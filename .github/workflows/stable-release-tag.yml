name: Stable Release Tag

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stable-release-tag.yml'
      - '.github/workflows/encrypted-production-backup.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: stable-release-tag
  cancel-in-progress: false

jobs:
  tag:
    if: contains(github.event.head_commit.message, 'P2 stable release tagging gate')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      EXPECTED_SHA: ${{ github.sha }}
      TAG_NAME: p2-99-stable
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Wait for exact release evidence and create stable tag
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ['REPOSITORY']
          expected_sha = os.environ['EXPECTED_SHA']
          tag_name = os.environ['TAG_NAME']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repository}'
          required = {
              'CI',
              'Security',
              'Production Deploy Certification',
              'Encrypted Production Backup',
          }

          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
              'User-Agent': 'adam-financial-book-stable-release-tagger',
          }

          def call(path, method='GET', body=None, allow_404=False):
              data = None if body is None else json.dumps(body).encode('utf-8')
              request = urllib.request.Request(api + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read().decode('utf-8')
                      return response.status, (json.loads(raw) if raw else None)
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return 404, None
                  body_text = exc.read().decode('utf-8', errors='replace')[:800]
                  raise SystemExit(f'GitHub API {method} {path} failed: {exc.code} {body_text}')

          chosen = {}
          for attempt in range(1, 73):
              _, payload = call(f'/actions/runs?head_sha={expected_sha}&per_page=100')
              runs = payload.get('workflow_runs', []) if isinstance(payload, dict) else []
              chosen = {}
              for name in required:
                  matches = [run for run in runs if run.get('name') == name and run.get('head_sha') == expected_sha]
                  if matches:
                      matches.sort(key=lambda item: item.get('created_at', ''), reverse=True)
                      chosen[name] = matches[0]

              terminal_bad = {
                  name: run.get('conclusion')
                  for name, run in chosen.items()
                  if run.get('status') == 'completed' and run.get('conclusion') not in (None, 'success')
              }
              if terminal_bad:
                  raise SystemExit(f'Exact-release evidence failed for {expected_sha}: {terminal_bad}')

              if required.issubset(chosen) and all(
                  chosen[name].get('status') == 'completed' and chosen[name].get('conclusion') == 'success'
                  for name in required
              ):
                  break

              if attempt == 72:
                  state = {
                      name: {
                          'status': chosen.get(name, {}).get('status'),
                          'conclusion': chosen.get(name, {}).get('conclusion'),
                          'runId': chosen.get(name, {}).get('id'),
                      }
                      for name in sorted(required)
                  }
                  raise SystemExit(f'Timed out waiting for exact-release evidence: {state}')
              time.sleep(15)

          backup_run = chosen['Encrypted Production Backup']
          _, artifact_payload = call(f"/actions/runs/{backup_run['id']}/artifacts?per_page=100")
          artifacts = artifact_payload.get('artifacts', []) if isinstance(artifact_payload, dict) else []
          valid_artifacts = [
              artifact for artifact in artifacts
              if artifact.get('name', '').startswith('adam-financial-book-backup-')
              and artifact.get('expired') is False
              and artifact.get('workflow_run', {}).get('head_sha') == expected_sha
          ]
          if not valid_artifacts:
              raise SystemExit('Encrypted backup workflow is green but no retained exact-SHA backup artifact was found.')

          encoded_tag = urllib.parse.quote(tag_name, safe='')
          status, existing = call(f'/git/ref/tags/{encoded_tag}', allow_404=True)
          if status == 200:
              observed = existing.get('object', {}).get('sha') if isinstance(existing, dict) else None
              if observed != expected_sha:
                  raise SystemExit(f'Tag {tag_name} already exists at {observed}, expected {expected_sha}.')
              print(json.dumps({
                  'event': 'stable.release.tag.already_correct',
                  'tag': tag_name,
                  'sha': expected_sha,
              }))
              raise SystemExit(0)

          call('/git/refs', 'POST', {'ref': f'refs/tags/{tag_name}', 'sha': expected_sha})
          _, created = call(f'/git/ref/tags/{encoded_tag}')
          observed = created.get('object', {}).get('sha') if isinstance(created, dict) else None
          if observed != expected_sha:
              raise SystemExit(f'Created tag did not resolve to expected SHA: {observed}')

          print(json.dumps({
              'event': 'stable.release.tag.created',
              'tag': tag_name,
              'sha': expected_sha,
              'evidenceRuns': {name: chosen[name]['id'] for name in sorted(required)},
              'backupArtifactId': valid_artifacts[0].get('id'),
              'backupArtifactDigest': valid_artifacts[0].get('digest'),
          }))
          PY
