name: Stable Release Tag

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main SHA to certify and tag
        required: true
        type: string
      tag_name:
        description: Stable tag to create
        required: true
        default: p11-100-stable
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: stable-release-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      EXPECTED_SHA: ${{ inputs.target_sha }}
      TAG_NAME: ${{ inputs.tag_name }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Require exact current-main release evidence and create stable tag
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ['REPOSITORY']
          expected_sha = os.environ['EXPECTED_SHA']
          tag_name = os.environ['TAG_NAME']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repository}'
          required = {
              'CI',
              'Security',
              'Production Deploy Certification',
              'Encrypted Production Backup',
              'Disaster Recovery Certification',
              'Real Device Mobile Certification',
              'Production Scale Certification',
              'Accounting Chaos Certification',
              'Performance Architecture Certification',
              'Production Observability Certification',
              'Final Production Certification',
              'Production Acceptance Certification',
              'System Closure Certification',
          }

          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
              'User-Agent': 'adam-financial-book-stable-release-tagger',
          }

          def call(path, method='GET', body=None, allow_404=False):
              data = None if body is None else json.dumps(body).encode('utf-8')
              request = urllib.request.Request(api + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read().decode('utf-8')
                      return response.status, (json.loads(raw) if raw else None)
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return 404, None
                  body_text = exc.read().decode('utf-8', errors='replace')[:800]
                  raise SystemExit(f'GitHub API {method} {path} failed: {exc.code} {body_text}')

          _, main = call('/branches/main')
          current_main = main.get('commit', {}).get('sha') if isinstance(main, dict) else None
          if current_main != expected_sha:
              raise SystemExit(f'Refusing to certify stale/non-main SHA {expected_sha}; current main is {current_main}.')

          chosen = {}
          for attempt in range(1, 73):
              _, payload = call(f'/actions/runs?head_sha={expected_sha}&per_page=100')
              runs = payload.get('workflow_runs', []) if isinstance(payload, dict) else []
              chosen = {}
              for name in required:
                  matches = [run for run in runs if run.get('name') == name and run.get('head_sha') == expected_sha]
                  if matches:
                      matches.sort(key=lambda item: item.get('created_at', ''), reverse=True)
                      chosen[name] = matches[0]

              terminal_bad = {
                  name: run.get('conclusion')
                  for name, run in chosen.items()
                  if run.get('status') == 'completed' and run.get('conclusion') not in (None, 'success')
              }
              if terminal_bad:
                  raise SystemExit(f'Exact-release evidence failed for {expected_sha}: {terminal_bad}')

              if required.issubset(chosen) and all(
                  chosen[name].get('status') == 'completed' and chosen[name].get('conclusion') == 'success'
                  for name in required
              ):
                  break

              if attempt == 72:
                  state = {
                      name: {
                          'status': chosen.get(name, {}).get('status'),
                          'conclusion': chosen.get(name, {}).get('conclusion'),
                          'runId': chosen.get(name, {}).get('id'),
                      }
                      for name in sorted(required)
                  }
                  raise SystemExit(f'Timed out waiting for exact-release evidence: {state}')
              time.sleep(15)

          def exact_artifact(workflow_name, predicate, missing_message):
              run = chosen[workflow_name]
              _, payload = call(f"/actions/runs/{run['id']}/artifacts?per_page=100")
              artifacts = payload.get('artifacts', []) if isinstance(payload, dict) else []
              valid = [
                  artifact for artifact in artifacts
                  if predicate(artifact)
                  and artifact.get('expired') is False
                  and artifact.get('workflow_run', {}).get('head_sha') == expected_sha
              ]
              if not valid:
                  raise SystemExit(missing_message)
              return valid[0]

          backup = exact_artifact(
              'Encrypted Production Backup',
              lambda artifact: artifact.get('name', '').startswith('adam-financial-book-backup-'),
              'Encrypted backup workflow is green but no retained exact-SHA backup artifact was found.',
          )
          mobile = exact_artifact(
              'Real Device Mobile Certification',
              lambda artifact: artifact.get('name') == f'real-device-mobile-certification-{expected_sha}',
              'Real-device workflow is green but no retained exact-SHA mobile certification artifact was found.',
          )
          final = exact_artifact(
              'Final Production Certification',
              lambda artifact: artifact.get('name') == f'final-production-certification-{expected_sha}',
              'Final certification workflow is green but no retained exact-SHA final certification artifact was found.',
          )
          acceptance = exact_artifact(
              'Production Acceptance Certification',
              lambda artifact: artifact.get('name') == f'production-acceptance-certification-{expected_sha}',
              'Production acceptance workflow is green but no retained exact-SHA production acceptance artifact was found.',
          )
          closure = exact_artifact(
              'System Closure Certification',
              lambda artifact: artifact.get('name') == f'system-closure-certification-{expected_sha}',
              'System closure workflow is green but no retained exact-SHA closure artifact was found.',
          )

          encoded_tag = urllib.parse.quote(tag_name, safe='')
          status, existing = call(f'/git/ref/tags/{encoded_tag}', allow_404=True)
          if status == 200:
              observed = existing.get('object', {}).get('sha') if isinstance(existing, dict) else None
              if observed != expected_sha:
                  raise SystemExit(f'Tag {tag_name} already exists at {observed}, expected {expected_sha}.')
              print(json.dumps({'event': 'stable.release.tag.already_correct', 'tag': tag_name, 'sha': expected_sha}))
              raise SystemExit(0)

          call('/git/refs', 'POST', {'ref': f'refs/tags/{tag_name}', 'sha': expected_sha})
          _, created = call(f'/git/ref/tags/{encoded_tag}')
          observed = created.get('object', {}).get('sha') if isinstance(created, dict) else None
          if observed != expected_sha:
              raise SystemExit(f'Created tag did not resolve to expected SHA: {observed}')

          print(json.dumps({
              'event': 'stable.release.tag.created',
              'tag': tag_name,
              'sha': expected_sha,
              'evidenceRuns': {name: chosen[name]['id'] for name in sorted(required)},
              'backupArtifactId': backup.get('id'),
              'mobileArtifactId': mobile.get('id'),
              'finalCertificationArtifactId': final.get('id'),
              'productionAcceptanceArtifactId': acceptance.get('id'),
              'systemClosureArtifactId': closure.get('id'),
          }))
          PY
